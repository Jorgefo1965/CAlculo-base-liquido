<meta name="apple-mobile-web-app-title" content="Closet">
<style>
  :root{
    --bg: #EFE9E1;
    --panel: #FFFFFF;
    --ink: #2B2420;
    --ink-soft: #6B6058;
    --line: #DCD3C7;
    --accent: #8A5A44;
    --accent-soft: #C9A98C;
    --tag: #4E5D52;
    --tag-bg: #E4E9E2;
    --danger: #A64B3C;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-label: 'Courier New', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 96px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  header{
    padding: 28px 0 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
  }
  header .eyebrow{
    font-family: var(--font-label);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1{
    font-family: var(--font-display);
    font-weight: 400;
    font-style: italic;
    font-size: 32px;
    margin: 4px 0 14px;
    letter-spacing: 0.01em;
  }

  .header-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .menu-btn{
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color: var(--ink); margin-top: 2px;
  }
  .menu-dropdown{
    display:none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    margin-top: 10px; overflow:hidden;
  }
  .menu-dropdown.open{ display:block; }
  .menu-dropdown button{
    width:100%; text-align:left; padding: 13px 16px; background:none; border:none;
    font-size:14px; color: var(--ink); display:flex; align-items:center; gap:10px;
    font-family: var(--font-body);
  }
  .menu-dropdown button:not(:last-of-type){ border-bottom: 1px solid var(--line); }
  .menu-dropdown button svg{ color: var(--accent); flex-shrink:0; }

  .search-row{
    display:flex; gap:8px;
  }
  .search-box{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-size:15px; width:100%; color:var(--ink); font-family: var(--font-body);
  }
  .search-box svg{flex-shrink:0; opacity:0.5;}

  .viewall-btn{
    flex-shrink:0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 14px; font-size: 13px; font-weight:600; color: var(--ink-soft);
    font-family: var(--font-body);
  }
  .viewall-btn.active{
    background: var(--accent); color: white; border-color: var(--accent);
  }

  .filters{
    display:flex; flex-wrap:wrap; gap:8px; padding: 12px 0 4px;
  }
  select.filter-chip{
    appearance:none; -webkit-appearance:none;
    background: var(--tag-bg);
    color: var(--tag);
    border:none;
    border-radius: 20px;
    padding: 7px 26px 7px 14px;
    font-size: 13px;
    font-family: var(--font-body);
    font-weight: 600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width: 100px;
    flex-shrink:0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234E5D52' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position: right 8px center;
    background-size: 12px;
  }
  select.filter-chip.active{
    background-color: var(--accent);
    color: white;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
  }
  .clear-filters{
    font-size:12px; color:var(--ink-soft); background:none; border:none;
    text-decoration:underline; padding:7px 4px; flex-shrink:0; font-family:var(--font-body);
  }

  .count-row{
    font-family: var(--font-label);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    padding: 14px 0 6px;
    text-transform: uppercase;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-top: 6px;
  }
  .card{
    background: var(--panel);
    border-radius: 14px;
    overflow:hidden;
    border: 1px solid var(--line);
    cursor:pointer;
    transition: transform .12s ease;
  }
  .card:active{ transform: scale(0.97); }
  .card .thumb{
    width:100%; aspect-ratio: 1/1; object-fit: cover; display:block;
    background: var(--tag-bg);
  }
  .card .meta{ padding: 10px 12px 12px; }
  .card .name{
    font-size: 14px; font-weight:600; margin:0 0 4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card .box-pill{
    display:inline-block;
    font-family: var(--font-label);
    font-size: 11px;
    background: var(--accent);
    color:white;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.03em;
  }

  .empty{
    text-align:center; padding: 60px 20px; color: var(--ink-soft);
  }
  .empty svg{opacity:0.35; margin-bottom:12px;}
  .empty p{font-family:var(--font-display); font-style:italic; font-size:18px; margin:0;}
  .empty span{font-size:13px;}

  .fab{
    position:fixed; right:20px; bottom:24px;
    width:60px; height:60px; border-radius:50%;
    background: var(--accent); color:white; border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(138,90,68,0.4);
    z-index: 30;
  }
  .fab:active{ transform: scale(0.94); }

  /* Modal detalle */
  .overlay{
    position:fixed; inset:0; background:rgba(43,36,32,0.55);
    z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:all; }
  .sheet{
    background: var(--bg);
    width:100%; max-width:640px;
    border-radius: 20px 20px 0 0;
    max-height: 92vh;
    overflow-y:auto;
    transform: translateY(100%);
    transition: transform .25s ease;
    padding-bottom: 24px;
  }
  .overlay.open .sheet{ transform: translateY(0); }
  .sheet-handle{
    width:36px; height:4px; background: var(--line); border-radius:4px;
    margin: 10px auto 4px;
  }
  .sheet-photo{
    width:100%; aspect-ratio: 4/3; object-fit:cover; background:var(--tag-bg);
  }
  .sheet-body{ padding: 18px 20px 4px; }
  .sheet-body h2{
    font-family: var(--font-display); font-style:italic; font-weight:400;
    font-size: 24px; margin: 0 0 10px;
  }
  .sheet-locate{
    background: var(--accent); color:white; border-radius:14px;
    padding: 16px; text-align:center; margin-bottom:16px;
  }
  .sheet-locate .lbl{
    font-family: var(--font-label); font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; opacity:0.85;
  }
  .sheet-locate .box{ font-size: 28px; font-weight:700; margin-top:2px; }
  .tags-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 18px; }
  .tags-row .tag{
    background: var(--tag-bg); color:var(--tag); font-size:12px; font-weight:600;
    padding:5px 12px; border-radius:20px;
  }
  .sheet-actions{ display:flex; gap:10px; }
  .sheet-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:600;
    font-family: var(--font-body);
  }
  .btn-edit{ background: var(--tag-bg); color: var(--ink); }
  .btn-delete{ background: transparent; color: var(--danger); border:1px solid var(--danger) !important; }
  .btn-close-sheet{
    display:block; margin: 14px auto 0; background:none; border:none; color:var(--ink-soft);
    font-size:13px; text-decoration:underline;
  }

  /* Modal formulario */
  .form-sheet .sheet-body{ padding: 14px 20px 8px; }
  .field{ margin-bottom: 16px; }
  .field label{
    display:block; font-family: var(--font-label); font-size:11px; text-transform:uppercase;
    letter-spacing:0.06em; color: var(--ink-soft); margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background: var(--panel); font-size:15px; font-family: var(--font-body); color:var(--ink);
  }
  .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background: var(--panel); font-size:15px; font-family: var(--font-body); color:var(--ink);
    appearance:none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6058' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position: right 14px center; background-size:14px;
  }
  .photo-picker{
    display:flex; gap:10px; margin-bottom: 18px;
  }
  .photo-picker label{
    flex:1; border: 1.5px dashed var(--accent-soft); border-radius: 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 18px 8px; color: var(--accent); font-size:12px; font-weight:600; gap:6px;
    text-align:center; cursor:pointer;
  }
  .photo-picker input{ display:none; }
  .preview-wrap{ position:relative; margin-bottom:18px; }
  .preview-wrap img{ width:100%; border-radius:12px; aspect-ratio:4/3; object-fit:cover; }
  .preview-wrap button{
    position:absolute; top:8px; right:8px; background: rgba(43,36,32,0.7); color:white;
    border:none; border-radius:50%; width:30px; height:30px; font-size:16px;
  }
  .save-btn{
    width:100%; padding:14px; border-radius:12px; border:none;
    background: var(--accent); color:white; font-size:15px; font-weight:700;
    font-family: var(--font-body); margin-top:4px;
  }
  .save-btn:disabled{ background: var(--accent-soft); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-top">
      <div>
        <div class="eyebrow">Closet · guía de carteras</div>
        <h1>¿Dónde está?</h1>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
    <div class="search-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar por nombre...">
      </div>
      <button class="viewall-btn" id="viewAllBtn">Ver todas</button>
    </div>
    <div class="filters" id="filtersRow"></div>
  </header>

  <div class="menu-dropdown" id="menuDropdown">
    <button id="exportBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      Exportar copia de seguridad
    </button>
    <button id="importBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0l-4 4m4-4l4 4M5 21h14"/></svg>
      Importar copia de seguridad
    </button>
    <input type="file" id="importFileInput" style="display:none;">
  </div>

  <div class="count-row" id="countRow">0 carteras</div>
  <div id="gridArea"></div>
</div>

<button class="fab" id="addBtn" aria-label="Agregar cartera">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Sheet: detalle -->
<div class="overlay" id="detailOverlay">
  <div class="sheet" id="detailSheet">
    <div class="sheet-handle"></div>
    <img class="sheet-photo" id="detailPhoto" src="" alt="">
    <div class="sheet-body">
      <h2 id="detailName"></h2>
      <div class="sheet-locate">
        <div class="lbl">Está en</div>
        <div class="box" id="detailBox"></div>
      </div>
      <div class="tags-row" id="detailTags"></div>
      <div class="sheet-actions">
        <button class="btn-edit" id="editBtn">Editar</button>
        <button class="btn-delete" id="deleteBtn">Eliminar</button>
      </div>
      <button class="btn-close-sheet" id="closeDetailBtn">Cerrar</button>
    </div>
  </div>
</div>

<!-- Sheet: formulario -->
<div class="overlay" id="formOverlay">
  <div class="sheet form-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body">
      <h2 id="formTitle">Nueva cartera</h2>

      <div class="photo-picker" id="photoPicker">
        <label>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Tomar foto
          <input type="file" accept="image/*" capture="environment" id="cameraInput">
        </label>
        <label>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Desde galería
          <input type="file" accept="image/*" id="galleryInput">
        </label>
      </div>
      <div class="preview-wrap" id="previewWrap" style="display:none;">
        <img id="previewImg" src="">
        <button id="removePhotoBtn">✕</button>
      </div>

      <div class="field">
        <label>Nombre (opcional)</label>
        <input type="text" id="fieldName" placeholder="Ej: Cartera negra grande">
      </div>

      <div class="field">
        <label>Caja</label>
        <select id="fieldBox">
          <option value="">Sin especificar</option>
          <option>Caja 1</option>
          <option>Caja 2</option>
          <option>Caja 3</option>
          <option>Caja 4</option>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const SUPABASE_URL = 'https://vunzglostcikazoybhma.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tkfiLjI5i1OZo-lTUoSrxw_HszY7r7Z';
let supabase = null;
try{
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(err){
  console.error('No se pudo inicializar Supabase', err);
}
const TABLE = 'carteras_items';
const BUCKET = 'carteras-fotos';

const DB_NAME = 'carterasDB';
const DB_STORE = 'items';
const LEGACY_KEY = 'carteras_v1';
let items = [];
let db = null;
let editingId = null;
let currentPhotoData = null;   // dataURL nueva foto tomada (aún no subida)
let currentPhotoUrl = null;    // url ya existente (al editar sin cambiar foto)
let currentDetailId = null;

const state = { search: '', color: '', size: '', occasion: '', box: '', showAll: false };

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const database = req.result;
      if(!database.objectStoreNames.contains(DB_STORE)){
        database.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const store = tx.objectStore(DB_STORE);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function cacheAll(list){
  return new Promise((resolve, reject) => {
    try{
      const tx = db.transaction(DB_STORE, 'readwrite');
      const store = tx.objectStore(DB_STORE);
      store.clear();
      list.forEach(it => store.put(it));
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    } catch(err){ reject(err); }
  });
}

async function migrateFromLocalStorageIfNeeded(){
  const legacy = localStorage.getItem(LEGACY_KEY);
  if(!legacy) return;
  try{
    const legacyItems = JSON.parse(legacy);
    if(Array.isArray(legacyItems) && legacyItems.length > 0){
      for(const it of legacyItems){
        // las fotos antiguas venían como dataURL; hay que subirlas a Storage
        let photoUrl = it.photo;
        if(photoUrl && photoUrl.startsWith('data:')){
          photoUrl = await uploadPhotoDataUrl(it.id, photoUrl);
        }
        await supabase.from(TABLE).upsert({
          id: it.id, name: it.name || '', box: it.box || '',
          color: it.color || '', size: it.size || '', occasion: it.occasion || '',
          photo_url: photoUrl || null,
        });
      }
    }
    localStorage.removeItem(LEGACY_KEY);
  } catch(err){
    console.error('Error migrando datos antiguos a Supabase', err);
  }
}

function rowToItem(row){
  return {
    id: row.id, name: row.name || '', box: row.box || '',
    color: row.color || '', size: row.size || '', occasion: row.occasion || '',
    photo: row.photo_url || '',
  };
}

async function fetchFromSupabase(){
  const { data, error } = await supabase.from(TABLE).select('*').order('created_at', { ascending: true });
  if(error) throw error;
  return data.map(rowToItem);
}

async function uploadPhotoDataUrl(id, dataUrl){
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const path = `${id}.jpg`;
  const { error } = await supabase.storage.from(BUCKET).upload(path, blob, {
    contentType: 'image/jpeg', upsert: true,
  });
  if(error) throw error;
  const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function initApp(){
  db = await openDB();
  if(!supabase){
    console.error('Supabase no disponible, usando solo copia local');
    items = await dbGetAll();
    renderFilters();
    renderGrid();
    alert('No se pudo conectar a internet para sincronizar. Se está mostrando la copia guardada en este celular. Revisa tu conexión y vuelve a abrir la app.');
    return;
  }
  await migrateFromLocalStorageIfNeeded();
  try{
    items = await fetchFromSupabase();
    await cacheAll(items);
  } catch(err){
    console.error('Sin conexión, usando copia local', err);
    items = await dbGetAll();
  }
  renderFilters();
  renderGrid();
}

function uid(){ return 'c' + Date.now() + Math.random().toString(36).slice(2,7); }

function uniqueValues(key){
  return [...new Set(items.map(i => i[key]).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' }));
}

function renderFilters(){
  const row = document.getElementById('filtersRow');
  row.innerHTML = '';

  const defs = [
    { key:'box', label:'Caja', values: uniqueValues('box') },
    { key:'color', label:'Color', values: uniqueValues('color') },
    { key:'size', label:'Tamaño', values: uniqueValues('size') },
    { key:'occasion', label:'Ocasión', values: uniqueValues('occasion') },
  ];

  defs.forEach(def => {
    if(def.values.length === 0) return;
    const sel = document.createElement('select');
    sel.className = 'filter-chip' + (state[def.key] ? ' active' : '');
    sel.innerHTML = `<option value="">${def.label}</option>` +
      def.values.map(v => `<option value="${v}" ${state[def.key]===v?'selected':''}>${v}</option>`).join('');
    sel.addEventListener('change', e => {
      state[def.key] = e.target.value;
      renderFilters();
      renderGrid();
      updateViewAllBtn();
    });
    row.appendChild(sel);
  });

  const anyActive = hasActiveFilter();
  if(anyActive){
    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-filters';
    clearBtn.textContent = 'Limpiar filtros';
    clearBtn.onclick = () => {
      state.search=''; state.color=''; state.size=''; state.occasion=''; state.box='';
      document.getElementById('searchInput').value = '';
      renderFilters(); renderGrid(); updateViewAllBtn();
    };
    row.appendChild(clearBtn);
  }
}

function filteredItems(){
  return items.filter(i => {
    if(state.search && !(i.name||'').toLowerCase().includes(state.search.toLowerCase())) return false;
    if(state.color && i.color !== state.color) return false;
    if(state.size && i.size !== state.size) return false;
    if(state.occasion && i.occasion !== state.occasion) return false;
    if(state.box && i.box !== state.box) return false;
    return true;
  });
}

function hasActiveFilter(){
  return !!(state.search || state.color || state.size || state.occasion || state.box);
}

function renderGrid(){
  const list = filteredItems();
  const area = document.getElementById('gridArea');
  const countRow = document.getElementById('countRow');

  if(items.length === 0){
    countRow.textContent = '0 carteras';
    area.innerHTML = `
      <div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7l1.5-3h15L21 7M3 7v12a1 1 0 001 1h16a1 1 0 001-1V7M3 7h18M9 11a3 3 0 006 0"/></svg>
        <p>Aún no hay carteras</p>
        <span>Toca el botón + para agregar la primera</span>
      </div>`;
    return;
  }

  if(!hasActiveFilter() && !state.showAll){
    countRow.textContent = `${items.length} ${items.length === 1 ? 'cartera guardada' : 'carteras guardadas'}`;
    area.innerHTML = `
      <div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <p>Busca o filtra tu cartera</p>
        <span>O toca "Ver todas" para ver el catálogo completo</span>
      </div>`;
    return;
  }

  document.getElementById('countRow').textContent =
    list.length + (list.length === 1 ? ' cartera' : ' carteras');

  if(list.length === 0){
    area.innerHTML = `
      <div class="empty">
        <p>Sin resultados</p>
        <span>Prueba con otro filtro o búsqueda</span>
      </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  list.slice().reverse().forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img class="thumb" src="${item.photo}" alt="${item.name||'cartera'}">
      <div class="meta">
        <p class="name">${item.name || 'Sin nombre'}</p>
        <span class="box-pill">${item.box || 'Sin caja'}</span>
      </div>`;
    card.onclick = () => openDetail(item.id);
    grid.appendChild(card);
  });
  area.innerHTML = '';
  area.appendChild(grid);
}

// Detalle
function openDetail(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  currentDetailId = id;
  document.getElementById('detailPhoto').src = item.photo;

document.getElementById('closeDetailBtn').onclick = closeDetail;

document.getElementById('deleteBtn').onclick = async () => {
  if(!currentDetailId) return;
  if(!supabase){
    alert('No hay conexión a internet. Vuelve a intentarlo cuando tengas señal o wifi.');

  }

document.getElementById('editBtn').onclick = () => {
  const item = items.find(i => i.id === currentDetailId);

// Formulario
const PREDEFINED = {
  box: ['Caja 1','Caja 2','Caja 3','Caja 4','Caja 5','Caja 6','Caja 7','Caja 8','Caja 9','Caja 10'],
  color: ['Negro','Café','Beige','Blanco','Rojo','Azul','Verde','Dorado','Plateado','Rosado','Estampado'],
  size: ['Mini','Pequeña','Mediana','Grande'],
  occasion: ['Diario','Trabajo','Elegante / Fiesta','Viaje','Playa','Deportiva'],
};
const FIELD_LABELS = { box: '+ Crear nueva caja', color: '+ Crear nuevo color', size: '+ Crear nuevo tamaño', occasion: '+ Crear nueva ocasión' };

function populateSelectOptions(key, selectId){
  const sel = document.getElementById(selectId);
  const predefined = PREDEFINED[key];
  const norm = v => v.trim().toLowerCase();
  const predefinedNorm = predefined.map(norm);
  const custom = uniqueValues(key).filter(v => !predefinedNorm.includes(norm(v)));
  sel.innerHTML = '<option value="">Sin especificar</option>' +
    predefined.map(v => `<option>${v}</option>`).join('') +
    (custom.length ? custom.map(v => `<option>${v}</option>`).join('') : '') +
    `<option value="__new__">${FIELD_LABELS[key]}</option>`;
}

function setSelectValue(key, selectId, newFieldId, newInputId, item){
  const sel = document.getElementById(selectId);
  const newField = document.getElementById(newFieldId);
  const newInput = document.getElementById(newInputId);
  newInput.value = '';
  const val = item ? (item[key]||'') : '';
  if(val && ![...sel.options].some(o => o.value === val)){
    sel.value = '__new__';
    newInput.value = val;
    newField.style.display = 'block';
  } else {
    sel.value = val;
    newField.style.display = 'none';
  }
}

function openForm(item){
  editingId = item ? item.id : null;
  currentPhotoData = null;
  currentPhotoUrl = item ? item.photo : null;
  document.getElementById('formTitle').textContent = item ? 'Editar cartera' : 'Nueva cartera';
  document.getElementById('fieldName').value = item ? (item.name||'') : '';

  populateSelectOptions('box', 'fieldBox');
  setSelectValue('box', 'fieldBox', 'newBoxField', 'fieldNewBox', item);

  populateSelectOptions('color', 'fieldColor');
  setSelectValue('color', 'fieldColor', 'newColorField', 'fieldNewColor', item);

  populateSelectOptions('size', 'fieldSize');
  setSelectValue('size', 'fieldSize', 'newSizeField', 'fieldNewSize', item);

  populateSelectOptions('occasion', 'fieldOccasion');
  setSelectValue('occasion', 'fieldOccasion', 'newOccasionField', 'fieldNewOccasion', item);

  updatePreview();
  updateSaveState();
  document.getElementById('formOverlay').classList.add('open');
}
function closeForm(){
  document.getElementById('formOverlay').classList.remove('open');
  document.getElementById('cameraInput').value = '';
  document.getElementById('galleryInput').value = '';
  editingId = null;
  currentPhotoData = null;
}

function updatePreview(){
  const wrap = document.getElementById('previewWrap');
  const picker = document.getElementById('photoPicker');
  const shown = currentPhotoData || currentPhotoUrl;
  if(shown){
    document.getElementById('previewImg').src = shown;
    wrap.style.display = 'block';
    picker.style.display = 'none';
  } else {
    wrap.style.display = 'none';
    picker.style.display = 'flex';
  }
}

function updateSaveState(){
  document.getElementById('saveBtn').disabled = !(currentPhotoData || currentPhotoUrl);
}

function handleFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    resizeImage(e.target.result, dataUrl => {
      currentPhotoData = dataUrl;
      updatePreview();
      updateSaveState();
    });
  };
  reader.readAsDataURL(file);
}

function resizeImage(dataUrl, callback){
  const img = new Image();
  img.onload = () => {
    const maxDim = 640;
    let { width, height } = img;
    if(width > height && width > maxDim){
      height = Math.round(height * (maxDim/width)); width = maxDim;
    } else if(height > maxDim){
      width = Math.round(width * (maxDim/height)); height = maxDim;
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.7));
  };
  img.src = dataUrl;
}

document.getElementById('cameraInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('galleryInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('removePhotoBtn').onclick = () => {

function wireNewFieldToggle(selectId, newFieldId){

  });
}
wireNewFieldToggle('fieldBox', 'newBoxField');
wireNewFieldToggle('fieldColor', 'newColorField');
wireNewFieldToggle('fieldSize', 'newSizeField');
wireNewFieldToggle('fieldOccasion', 'newOccasionField');

document.getElementById('addBtn').onclick = () => openForm(null);
document.getElementById('closeFormBtn').onclick = closeForm;
document.getElementById('formOverlay').addEventListener('click', e => {
  if(e.target.id === 'formOverlay') closeForm();

document.getElementById('saveBtn').onclick = async () => {
  if(!currentPhotoData && !currentPhotoUrl) return;
  if(!supabase){
    alert('No hay conexión a internet. No se pudo guardar — vuelve a intentarlo cuando tengas señal o wifi.');
    return;
  }
  function resolveValue(selectId, newInputId){
    const v = document.getElementById(selectId).value;
    return v === '__new__' ? document.getElementById(newInputId).value.trim() : v;
  }
  const id = editingId || uid();
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  try{
    let photoUrl = currentPhotoUrl;
    if(currentPhotoData){
      photoUrl = await uploadPhotoDataUrl(id, currentPhotoData);
    }
    const record = {
      id,
      name: document.getElementById('fieldName').value.trim(),
      box: resolveValue('fieldBox', 'fieldNewBox'),
      color: resolveValue('fieldColor', 'fieldNewColor'),
      size: resolveValue('fieldSize', 'fieldNewSize'),
      occasion: resolveValue('fieldOccasion', 'fieldNewOccasion'),
      photo_url: photoUrl,
    };
    const { error } = await supabase.from(TABLE).upsert(record);
    if(error) throw error;

    const data = { id, name: record.name, box: record.box, color: record.color, size: record.size, occasion: record.occasion, photo: photoUrl };
    if(editingId){
      const idx = items.findIndex(i => i.id === editingId);
      items = items.slice();
      items[idx] = data;
    } else {
      items = items.concat([data]);
    }
    await cacheAll(items);
    closeForm();
    renderFilters();
    renderGrid();
  } catch(err){
    console.error('Error guardando', err);
    alert('No se pudo guardar. Revisa tu conexión a internet e intenta de nuevo.');
  } finally {
    saveBtn.disabled = false;
  }
};

document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  renderGrid();
  updateViewAllBtn();
});

function updateViewAllBtn(){
  document.getElementById('viewAllBtn').classList.toggle('active', state.showAll);
}

document.getElementById('viewAllBtn').onclick = () => {
  state.showAll = !state.showAll;
  if(state.showAll){
    state.search=''; state.color=''; state.size=''; state.occasion=''; state.box='';
    document.getElementById('searchInput').value = '';
  }
  updateViewAllBtn();
  renderFilters();
  renderGrid();
};


// Menú, exportar e importar
document.getElementById('menuBtn').onclick = () => {
  document.getElementById('menuDropdown').classList.toggle('open');
};

document.getElementById('exportBtn').onclick = () => {
  const payload = {
    app: 'carteras',
    exportedAt: new Date().toISOString(),
    items: items,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `copia-carteras-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('menuDropdown').classList.remove('open');
};

document.getElementById('importBtn').onclick = () => {
  document.getElementById('importFileInput').click();
};

document.getElementById('importFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async evt => {
    try{
      const parsed = JSON.parse(evt.target.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.items;
      if(!Array.isArray(incoming)) throw new Error('formato inválido');

      const existingIds = new Set(items.map(i => i.id));
      let added = 0, skipped = 0;
      for(const inc of incoming){
        if(inc && inc.id && !existingIds.has(inc.id)){
          let photoUrl = inc.photo;
          if(photoUrl && photoUrl.startsWith('data:')){
            photoUrl = await uploadPhotoDataUrl(inc.id, photoUrl);
          }
          const record = {
            id: inc.id, name: inc.name || '', box: inc.box || '',
            color: inc.color || '', size: inc.size || '', occasion: inc.occasion || '',
            photo_url: photoUrl || null,
          };
          const { error } = await supabase.from(TABLE).upsert(record);
          if(error) throw error;
          items.push({ id: inc.id, name: record.name, box: record.box, color: record.color, size: record.size, occasion: record.occasion, photo: photoUrl });
          existingIds.add(inc.id);
          added++;
        } else {
          skipped++;
        }
      }
      await cacheAll(items);
      renderFilters();
      renderGrid();
      document.getElementById('menuDropdown').classList.remove('open');
      alert(`Copia importada: ${added} cartera(s) nueva(s) agregada(s)${skipped ? `, ${skipped} ya existían y no se duplicaron` : ''}.`);
    } catch(err){
      console.error(err);
      alert('No se pudo importar. Revisa tu conexión a internet, o que sea una copia de seguridad exportada desde esta app.');
    }
    document.getElementById('importFileInput').value = '';
  };
  reader.readAsText(file);
});

// Init
initApp();
})();
