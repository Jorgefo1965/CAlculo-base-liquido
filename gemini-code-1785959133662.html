<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Sueldo Chile</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h1 { font-size: 22px; color: #333; margin-top: 0; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0056b3; }
    .result { margin-top: 20px; padding: 15px; background: #eef9f1; border: 1px solid #c3e6cb; border-radius: 5px; }
    .result h3 { margin: 0 0 10px 0; color: #155724; font-size: 16px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
    .indicadores { font-size: 12px; color: #777; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h1>Calculadora de Sueldo Chile 🇨🇱</h1>
  
  <div class="form-group">
    <label>Modo de Cálculo:</label>
    <select id="modo">
      <option value="brutoALiquido">Calcular Líquido a partir del Bruto</option>
      <option value="liquidoABruto">Calcular Bruto requerido a partir del Líquido</option>
    </select>
  </div>

  <div class="form-group">
    <label id="lblMonto">Sueldo Base ($ CLP):</label>
    <input type="number" id="monto" value="1000000" step="1000">
  </div>

  <div class="form-group">
    <label>AFP:</label>
    <select id="afp">
      <option value="habitat">AFP Habitat (11.27%)</option>
      <option value="uno">AFP Uno (10.46%)</option>
      <option value="modelo">AFP Modelo (10.58%)</option>
      <option value="planvital">AFP PlanVital (11.16%)</option>
      <option value="capital">AFP Capital (11.44%)</option>
      <option value="cuprum">AFP Cuprum (11.44%)</option>
      <option value="provida">AFP Provida (11.45%)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Bonos No Imponibles (Colación / Movilización):</label>
    <input type="number" id="bonosNoImponibles" value="50000" step="1000">
  </div>

  <button onclick="ejecutarCalculo()">Calcular</button>

  <div id="resultado" class="result" style="display: none;"></div>
  <div id="indicadores" class="indicadores">Cargando indicadores económicos...</div>
</div>

<script src="app.js"></script>
</body>
</html>
