name: Actualizar Indicadores Económicos

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC (05:00 AM hora de Chile)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecutar la actualización manualmente si deseas probarla

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener indicadores desde la API y actualizar app.js
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          https.get('https://mindicador.cl/api', (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              try {
                const json = JSON.parse(data);
                const uf = json.uf.valor;
                const utm = json.utm.valor;

                if (!uf || !utm) throw new Error('Datos invalidos recibidos de la API');

                let content = fs.readFileSync('app.js', 'utf8');

                // Reemplaza los valores de UF y UTM preservando el resto de las variables legalmente vigentes
                content = content.replace(/uf:\s*[\d.]+/g, 'uf: ' + uf);
                content = content.replace(/utm:\s*[\d.]+/g, 'utm: ' + utm);

                fs.writeFileSync('app.js', content, 'utf8');
                console.log('app.js actualizado con exito: UF ' + uf + ' | UTM ' + utm);
              } catch (e) {
                console.error('Error procesando datos:', e.message);
                process.exit(1);
              }
            });
          }).on('error', (err) => {
            console.error('Error al consultar la API:', err.message);
            process.exit(1);
          });
          "

      - name: Guardar y enviar cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          if ! git diff --staged --quiet; then
            git commit -m "bot: actualización automática de indicadores económicos (UF/UTM)"
            git push
          else
            console.log("Los indicadores no han cambiado. No requiere commit.");
          fi
